<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floraliv - Alivio Natural y Ligereza</title>
    <!-- Usamos la fuente Outfit, muy elegante, redonda y similar al estilo "Calm" -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Favicon (Logo de la pestaña) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
</head>
<body>
    <!-- Fondo animado relajante -->
    <div class="background-animation"></div>
    
    <main class="container">
        <!-- Logo minimalista -->
        <header>
            <h1 class="logo">Floraliv.</h1>
            <p class="subtitle">by Fuxion</p>
        </header>

        <!-- Sección Principal del VSL -->
        <section class="vsl-section">
            <h2 class="headline">¿Pesadez y mala digestión todos los días? <br><span>Descubre cómo volver a sentirte ligero.</span></h2>
            
            <div class="video-wrapper" id="vsl-wrapper">
                <video id="vsl-video" src="https://young-heart-ca84.fuxion-salud.workers.dev" controlsList="nodownload" style="width: 100%; height: 100%; border-radius: 24px; object-fit: cover; background: #000;" playsinline></video>
                
                <!-- Overlay VSL Customizado (Para ocultar controles nativos) -->
                <div class="custom-video-overlay" id="video-overlay">
                    <div class="play-button-pulse">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg" style="margin-left: 5px;">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </div>
                    <p class="overlay-text">Haz clic para descubrir el secreto</p>
                </div>
            </div>

            <!-- Botón CTA (Oculto inicialmente por estrategia VSL) -->
            <div class="cta-container" id="cta-container">
                <p class="cta-hook">El alivio que tu cuerpo estaba pidiendo.</p>
                <button class="cta-button" onclick="window.open('https://tiendafuxion.com/enrollment/cartview', '_blank')">Sí, quiero sentirme ligero hoy</button>
                <div class="security-badges">
                    <span>🌱 100% Natural</span>
                    <span>🛡️ Compra Segura</span>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
