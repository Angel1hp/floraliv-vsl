<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floraliv - Alivio Natural y Ligereza</title>
    <!-- Usamos la fuente Outfit, muy elegante, redonda y similar al estilo "Calm" -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Fondo animado relajante -->
    <div class="background-animation"></div>
    
    <main class="container">
        <!-- Logo minimalista -->
        <header>
            <h1 class="logo">Floraliv.</h1>
            <p class="subtitle">by Fuxion</p>
        </header>

        <!-- Sección Principal del VSL -->
        <section class="vsl-section">
            <h2 class="headline">¿Pesadez y mala digestión todos los días? <br><span>Descubre cómo volver a sentirte ligero.</span></h2>
            
            <div class="video-wrapper">
                <!-- Aquí iría tu iframe de Vimeo o YouTube ocultando controles -->
                <div class="video-placeholder">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
                    <p>Haz clic para reproducir el video</p>
                </div>
            </div>

            <!-- Botón CTA (Oculto inicialmente por estrategia VSL) -->
            <div class="cta-container" id="cta-container">
                <p class="cta-hook">El alivio que tu cuerpo estaba pidiendo.</p>
                <button class="cta-button">Sí, quiero sentirme ligero hoy</button>
                <div class="security-badges">
                    <span>🌱 100% Natural</span>
                    <span>🛡️ Compra Segura</span>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
